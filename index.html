
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CapOrFacts</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #111111;
      --line: rgba(0, 0, 0, 0.08);
      --overlap: rgba(0, 0, 0, 0.06);
      --green: #20c878;
      --green-hover: #16a967;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #080808;
        --text: #ffffff;
        --line: rgba(255, 255, 255, 0.08);
        --overlap: rgba(255, 255, 255, 0.05);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: "Fredoka", sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Background with crossing lines */
    .background-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        repeating-linear-gradient(
          45deg,
          transparent 0 48px,
          var(--line) 49px 50px
        ),
        repeating-linear-gradient(
          -45deg,
          transparent 0 48px,
          var(--line) 49px 50px
        );
    }

    .background-lines::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent 0 96px,
        var(--overlap) 97px 99px
      );
    }

    /* Header */
    header {
      position: relative;
      z-index: 1;
      padding: 24px;
    }

    /* NEW TEXT-ONLY LOGO */
    .brand-logo {
      display: inline-block;
      color: var(--text);
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      line-height: 1;
    }

    .brand-top {
      display: flex;
      align-items: baseline;
      gap: 4px;
      width: max-content;
      white-space: nowrap;
    }

    .brand-cap {
      font-size: 50px;
    }

    .brand-or {
      font-size: 25px;
    }

    .brand-facts {
      font-size: 50px;
      white-space: nowrap;
      width: max-content;
      line-height: 1.00;
      transform-origin: left top;
    }

    /* Main page */
    main {
      position: relative;
      z-index: 1;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: clamp(38px, 8vw, 68px);
      font-weight: 600;
      margin: 0 0 14px;
    }

    .subtitle {
      font-size: 18px;
      margin: 0 0 30px;
      opacity: 0.75;
    }

    .download-button {
      display: inline-block;
      padding: 15px 34px;
      border: none;
      border-radius: 14px;
      background: var(--green);
      color: #071b10;
      font: 600 20px "Fredoka", sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .download-button:hover {
      background: var(--green-hover);
      transform: translateY(-2px);
    }

    .download-note {
      margin-top: 14px;
      font-size: 14px;
      opacity: 0.65;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 20px;
      text-align: center;
      font-size: 14px;
      opacity: 0.65;
    }

    @media (max-width: 400px) {
      header {
        padding: 16px;
      }

      .brand-cap {
        font-size: 42px;
      }

      .brand-or {
        font-size: 21px;
      }

      .brand-facts {
        font-size: 63px;
      }
    }
  </style>
</head>

<body>
  <div class="background-lines"></div>

  <header>
    <div class="brand-logo" aria-label="Cap Or Facts">
      <div class="brand-top">
        <span class="brand-cap">Cap</span>
        <span class="brand-or">Or</span>
      </div>
      <div class="brand-facts">Facts</div>
    </div>
  </header>

  <main>
    <h1>Cap or Facts?</h1>
    <p class="subtitle">
      Think you know the truth? Put it to a vote.
    </p>

    <a
      class="download-button"
      id="downloadButton"
      href="#"
    >
      Download APK
    </a>

    <p class="download-note" id="downloadNote">
      Android app coming soon.
    </p>
  </main>

  <footer>
    CapOrFacts · Decide what is cap and what is facts.
  </footer>

  <script>
    /*
      When your APK is ready, replace the empty value
      with its real download URL.
    */
    const downloadUrl = "";

    const downloadButton =
      document.getElementById("downloadButton");

    const downloadNote =
      document.getElementById("downloadNote");

    downloadButton.addEventListener("click", function (event) {
      if (!downloadUrl) {
        event.preventDefault();
        downloadNote.textContent =
          "The APK is not available for download yet.";
        return;
      }

      downloadButton.href = downloadUrl;
    });

    /*
      Match the rendered width of Facts to the combined
      rendered width of Cap + Or, including their gap.
    */
    function fitFacts() {
      const top = document.querySelector(".brand-top");
      const facts = document.querySelector(".brand-facts");

      if (!top || !facts) return;

      facts.style.transform = "scaleX(1)";

      const topWidth = top.getBoundingClientRect().width;
      const factsWidth = facts.getBoundingClientRect().width;

      if (factsWidth > 0) {
        facts.style.transform =
          `scaleX(${topWidth / factsWidth})`;
      }
    }

    document.fonts.ready.then(fitFacts);
    window.addEventListener("resize", fitFacts);
  </script>
</body>
</html>
